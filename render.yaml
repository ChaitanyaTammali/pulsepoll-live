services:
  - type: keyvalue
    name: pulse-cache
    region: singapore
    plan: free
    ipAllowList: []

  - type: web
    name: pulse-api
    runtime: go
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: go build -o server .
    startCommand: ./server
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DATABASE
        value: pulsepoll
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pulse-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: pulse-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pulse-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
